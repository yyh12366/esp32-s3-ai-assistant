[project]
name = "astrbot-relay"
version = "0.1.0"
description = "Relay between FoloToy AI Passport voice devices and AstrBot (ASR -> AstrBot -> TTS)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
proxy = ["httpx[socks]>=0.27"]

[project.scripts]
astrbot-relay = "relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
